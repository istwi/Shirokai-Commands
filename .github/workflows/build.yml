name: Build and tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain
      - run: python3 scripts/integration-test.py
      - uses: actions/upload-artifact@v4
        with:
          name: shirokai-commands-1.0.0+1.21.1
          path: build/libs/shirokai-commands-1.0.0+1.21.1.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            run/integration/test-result.txt
            run/integration/logs/latest.log
